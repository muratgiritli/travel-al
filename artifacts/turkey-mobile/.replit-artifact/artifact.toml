kind = "mobile"
previewPath = "/mobile/"
title = "Turkey Travel Mobile"
description = "A native mobile companion app for the Turkey Travel Assistant. Lets travelers select their passport country and chat with an AI assistant for visa info, entry requirements, and travel tips for Turkey — all on the go. Mirrors the web app's passport selection → chat flow and connects to the same backend API."
version = "1.0.0"
id = "artifacts/turkey-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18153

[services.development]
run = "pnpm --filter @workspace/turkey-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/turkey-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/turkey-mobile", "run", "serve" ]

[services.env]
PORT = "18153"
BASE_PATH = "/mobile/"
