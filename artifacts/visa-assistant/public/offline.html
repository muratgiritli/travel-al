<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff3c00" />
    <title>You are offline — Türkiye Travel Office</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f6f9;
        color: #0f172a;
      }
      .card {
        max-width: 380px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 32px 24px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #ff3c00;
        display: grid;
        place-items: center;
        font-size: 30px;
      }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.55; color: #475569; margin: 0 0 20px; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #ff3c00;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">☾</div>
      <h1>You are offline</h1>
      <p>We could not reach Türkiye Travel Office. Check your connection and try again — your saved application stays on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
